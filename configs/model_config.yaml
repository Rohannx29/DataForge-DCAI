# Model + training hyperparameters.
# THIS FILE MUST NOT CHANGE BETWEEN EXPERIMENTAL CONDITIONS.
# Only data/label/dcai configs are allowed to vary — this is the controlled variable
# that lets performance differences be attributed to data quality.

model:
  architecture: "resnet18"           # options: resnet18, efficientnet_b0 (via timm)
  pretrained: true
  num_classes: 2
  freeze_backbone: false
  dropout: 0.3

training:
  epochs: 20                          # reduced from 30 — CPU training confirmed; early stopping will
                                        # likely trigger sooner anyway given dataset size (909 train images)
  batch_size: 32
  optimizer: "adamw"
  learning_rate: 0.0003
  weight_decay: 0.0001
  lr_scheduler: "cosine"
  early_stopping_patience: 5
  mixed_precision: true               # NOTE: has no effect yet — train.py doesn't currently implement
                                        # AMP (torch.cuda.amp), and it wouldn't help on CPU regardless.
                                        # Flag reserved for when this project runs on GPU (Phase 2 / Colab).

evaluation:
  metrics:
    - "accuracy"
    - "precision"
    - "recall"
    - "f1"
    - "auroc"
  primary_metric: "f1"                # used for early stopping / model selection
                                        # NOT accuracy, due to class imbalance
  n_runs: 5                            # repeat each condition 5x for confidence intervals